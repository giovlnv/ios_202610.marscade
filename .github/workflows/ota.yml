name: Publish OTA update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ota
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package bundle
        run: |
          VERSION=$(git log -1 --format=%ct)
          mkdir ota
          (cd www && zip -qr ../ota/bundle-$VERSION.zip .)
          SUM=$(sha256sum ota/bundle-$VERSION.zip | cut -d' ' -f1)
          URL=https://raw.githubusercontent.com/${{ github.repository }}/ota/bundle-$VERSION.zip
          echo "{\"version\":\"$VERSION\",\"url\":\"$URL\",\"checksum\":\"$SUM\",\"commit\":\"${{ github.sha }}\"}" > ota/latest.json
          cat ota/latest.json

      - name: Publish to the ota branch
        run: |
          cd ota
          git init -q -b ota
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "OTA ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ota
